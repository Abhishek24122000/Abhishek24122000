<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#244677"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C9CFF"/><stop offset="1" stop-color="#C06BFF"/></linearGradient>
<clipPath id="c"><rect width="1200" height="280" rx="14"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="280" fill="url(#bg)"/>
<g opacity="0.55">
<rect x="-60" y="-60" width="220" height="220" fill="#2d5190" transform="rotate(45 50 50)"><animateTransform attributeName="transform" type="translate" values="0 0;24 14;0 0" dur="9s" repeatCount="indefinite" additive="sum"/></rect>
<rect x="880" y="-90" width="260" height="260" fill="#1f3b6d" transform="rotate(45 1010 40)"><animateTransform attributeName="transform" type="translate" values="0 0;-20 18;0 0" dur="11s" repeatCount="indefinite" additive="sum"/></rect>
<rect x="1010" y="120" width="200" height="200" fill="#34609f" transform="rotate(45 1110 220)"><animateTransform attributeName="transform" type="translate" values="0 0;-14 -16;0 0" dur="10s" repeatCount="indefinite" additive="sum"/></rect>
<rect x="520" y="190" width="170" height="170" fill="#183058" transform="rotate(45 605 275)"><animateTransform attributeName="transform" type="translate" values="0 0;18 -10;0 0" dur="12s" repeatCount="indefinite" additive="sum"/></rect>
</g>
<g fill="#fff">
<circle cx="760" cy="60" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="840" cy="210" r="2.5"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="420" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="1100" cy="70" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
</g>
<g font-family="'Segoe UI','Helvetica Neue',Arial,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif">
<text x="70" y="125" font-size="56" font-weight="700" fill="#ffffff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/><animate attributeName="x" from="40" to="70" dur="1s" fill="freeze"/>Abhishek Palsodkar</text>
<rect x="70" y="146" width="0" height="4" rx="2" fill="url(#ln)"><animate attributeName="width" from="0" to="220" dur="1.2s" begin="0.4s" fill="freeze"/></rect>
<text x="70" y="192" font-size="24" fill="#cfe0ff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.7s" fill="freeze"/>Data Scientist  ·  Data Analyst  ·  Machine Learning</text>
<text x="70" y="232" font-size="18" fill="#9fb6e0" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.1s" fill="freeze"/>アビシェク・パルソドカール　|　データサイエンス / 機械学習</text>
</g>
</g>
</svg>